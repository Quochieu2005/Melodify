name: Keep Render awake

# A Render service on a plan that stops idle servers sleeps after about 15 minutes without traffic, and the next
# visitor waits 10 to 60 seconds for it to start. A request every 10 minutes keeps it running.
# GitHub may delay scheduled runs by a few minutes, and turns schedules off after 60 days without repository
# activity; an uptime monitor pinging /up is the sturdier alternative (or a Render plan that never sleeps).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /up
        run: curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 90 https://melodify-6kc9.onrender.com/up
