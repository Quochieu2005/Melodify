; The official php:apache image ships no php.ini, so PHP falls back to upload_max_filesize=2M,
; post_max_size=8M and memory_limit=128M. Songs are validated up to 100 MB and covers up to 5 MB.
upload_max_filesize = 110M
post_max_size = 120M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
